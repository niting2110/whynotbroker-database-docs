name: "📚 Generate Database Documentation (minimal)"

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  generate-db-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install minimal runtime deps (CI-only)
        working-directory: scripts
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund --no-progress
          else
            npm init -y >/dev/null 2>&1
            npm install pg dotenv pg-format --no-save --no-audit --no-fund --no-progress
            rm -f package.json package-lock.json
          fi

      - name: Run generator
        working-directory: scripts
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          LOG_FILE="generation-${TIMESTAMP}.log"
          REPORT_FILE="generation-report-${TIMESTAMP}.json"
          timeout 600 node generate-complete-docs.js 2>&1 | tee "${LOG_FILE}"
          echo "log_file=${LOG_FILE}" >> "$GITHUB_OUTPUT"
          echo "report_file=${REPORT_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-docs-${{ github.run_id }}
          path: |
            scripts/${{ steps.run-generator.outputs.log_file }}
            scripts/${{ steps.run-generator.outputs.report_file }}