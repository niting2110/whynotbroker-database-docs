name: Generate Database Docs

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/db-docs.yml'

jobs:
  generate-db-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    env:
      CI: true                # This will trigger the SSL fix in the script
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true   # ensure subsequent git push is authenticated

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Generate database documentation
        working-directory: scripts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: true  # Force SSL for Supabase
        run: node generate-complete-docs.js

      - name: Commit and push generated docs
        # only add the expected output files to avoid accidental commits
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only docs that the script writes (adjust paths if your script writes elsewhere)
          git add README.md FULL-SCHEMA.md QUICK-START.md COMMON-ERRORS.md schema.json examples.json constraints.json relationships.json changelog.json ai-prompt-template.md cheatsheets || true
          # Also add cheatsheets directory content (if present)
          git add cheatsheets/ || true
          # If there are no staged changes, do nothing
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "📚 Auto-update database docs"
          git push