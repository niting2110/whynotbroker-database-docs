name: Generate Database Docs

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/db-docs.yml'

jobs:
  generate-db-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Configure network for Supabase connectivity
        run: |
          echo "Configuring network for Supabase connectivity..."
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          echo "✅ Network configured for IPv4"

      - name: Set environment
        id: env
        run: |
          ENV=""
          if [ -z "$ENV" ]; then
            ENV="production"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Using environment: $ENV"

      - name: Install dependencies
        working-directory: scripts
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test database connectivity
        working-directory: scripts
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          ALLOW_INSECURE_TLS: 'true'
          DB_SSL: 'true'
        run: |
          echo "Testing database connection..."
          node -e "
          const { Client } = require('pg');
          const dns = require('dns');

          dns.setDefaultResultOrder('ipv4first');

          async function testConnection() {
            const connectionString = process.env.DATABASE_URL;
            if (!connectionString) {
              console.error('❌ DATABASE_URL is not set');
              process.exit(1);
            }

            const hostname = new URL(connectionString).hostname;
            console.log('Testing DNS resolution for:', hostname);
            const addresses = await dns.promises.resolve4(hostname);
            console.log('✅ DNS resolved to:', addresses[0]);

            const client = new Client({
              connectionString,
              ssl: { rejectUnauthorized: false },
              connectionTimeoutMillis: 15000
            });

            await client.connect();
            console.log('✅ Database connection successful');

            const res = await client.query('SELECT version()');
            console.log('PostgreSQL version:', res.rows[0].version.substring(0, 50) + '...');
            await client.end();
            console.log('✅ Connection test completed');
          }

          testConnection().catch(err => {
            console.error('❌ Connection failed:', err.message);
            process.exit(1);
          });
          "

      - name: Generate documentation
        id: generate
        working-directory: scripts
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          ALLOW_INSECURE_TLS: 'true'
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update }}
          CI: true
          NODE_ENV: production
          TZ: Asia/Kolkata
          DB_SSL: true
          OUTPUT_DIR: '../docs/database'
          NODE_OPTIONS: '--dns-result-order=ipv4first'
        run: |
          echo "Starting documentation generation..."
          echo "Environment: $ENVIRONMENT"
          echo "Node version: $(node --version)"

          START_TIME=$(date +%s)

          # FIXED: Using generate-complete-docs-final.js instead
          if timeout 600 node generate-complete-docs-final.js; then
            EXIT_CODE=0
            echo "✅ Documentation generated successfully"
          else
            EXIT_CODE=$?
            echo "❌ Documentation generation failed"
            exit $EXIT_CODE
          fi

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📚 Auto-update database docs [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push
          fi

      - name: Upload documentation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-docs-${{ github.run_id }}
          path: |
            scripts/docs/
            docs/database/
          retention-days: 7