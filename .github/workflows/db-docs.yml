name: "📚 Generate Database Documentation (minimal safe)"

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  generate-db-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    env:
      OUTPUT_DIR: './docs/database'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure DATABASE_URL
        id: configure-db
        env:
          INPUT_ENV: ${{ github.event.inputs.environment || 'production' }}
        run: |
          set -euo pipefail
          TARGET="${INPUT_ENV}"
          echo "Selected environment: ${TARGET}"

          case "${TARGET}" in
            production)
              echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
              ;;
            staging)
              echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL || secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
              ;;
            development)
              echo "DATABASE_URL=${{ secrets.DEVELOPMENT_DATABASE_URL || secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
              ;;
            *)
              echo "::error::Unknown environment: ${TARGET}"
              exit 1
              ;;
          esac

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret not configured for environment ${TARGET}"
            exit 1
          fi

          echo "DATABASE_URL configured (redacted)."

      - name: Install lightweight deps (CI-only)
        working-directory: scripts
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund --no-progress
          else
            npm init -y >/dev/null 2>&1
            npm install pg dotenv pg-format --no-save --no-audit --no-fund --no-progress
            rm -f package.json package-lock.json
          fi

      - name: Run generator
        id: generate
        working-directory: scripts
        env:
          RUN_ID: ${{ github.run_id }}
          INPUT_FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          LOG="generation-${TIMESTAMP}.log"
          REPORT="generation-report-${TIMESTAMP}.json"

          echo "RUN_ID=${RUN_ID}"
          echo "FORCE_UPDATE=${INPUT_FORCE_UPDATE}"
          START=$(date +%s)

          if timeout 600 node generate-complete-docs.js 2>&1 | tee "${LOG}"; then
            EXIT=0
          else
            EXIT=${PIPESTATUS[0]:-1}
          fi

          END=$(date +%s)
          DURATION=$((END - START))

          cat > "${REPORT}" <<EOF
{
  "run_id": "${RUN_ID}",
  "duration_seconds": ${DURATION},
  "exit_code": ${EXIT}
}
EOF

          echo "log_file=${LOG}" >> "$GITHUB_OUTPUT"
          echo "report_file=${REPORT}" >> "$GITHUB_OUTPUT"
          echo "duration=${DURATION}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT}" >> "$GITHUB_OUTPUT"

          if [ "${EXIT}" -ne 0 ]; then
            echo "::error::Generator exited with code ${EXIT}"
            exit "${EXIT}"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-docs-${{ github.run_id }}
          path: |
            scripts/${{ steps.generate.outputs.log_file }}
            scripts/${{ steps.generate.outputs.report_file }}
          retention-days: 7
          if-no-files-found: warn