'use strict';

require('dotenv').config();
const { Pool } = require('pg');
const fs = require('fs');
const fsp = fs.promises;
const path = require('path');
const format = require('pg-format');

const REDACT_RE = /password=[^&]*/i;

function redactConnectionString(connStr = '') {
  return connStr.replace(REDACT_RE, 'password=***');
}

class CompleteDocumenter {
  constructor() {
    const connectionString = process.env.DATABASE_URL;
    
    if (!connectionString) {
      console.error('❌ Error: DATABASE_URL environment variable is not set!');
      console.error('   This usually means:');
      console.error('   1. The GitHub secret is not configured');
      console.error('   2. The workflow is not passing the environment variable');
      console.error('   3. Running locally without a .env file');
      console.error('');
      console.error('   To fix:');
      console.error('   - Check GitHub repository secrets');
      console.error('   - Verify workflow sets DATABASE_URL');
      console.error('   - For local testing, create a .env file with DATABASE_URL=...');
      throw new Error('DATABASE_URL environment variable is not set');
    }
    
    // For GitHub Actions/Supabase, we need to allow self-signed certificates
    // This is a controlled environment, so it's acceptable
    if (process.env.CI === 'true' || process.env.NODE_ENV === 'production') {
      console.warn('⚠️ Running in CI/Production - Accepting self-signed certificates for Supabase');
      process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0';
    }
    
    console.log('🚀 Generating COMPLETE database documentation...');
    console.log('Database URL present:', !!connectionString);
    console.log('Node version:', process.version);
    console.log('Redacted connection string:', redactConnectionString(connectionString));
    console.log('Environment:', process.env.DB_ENVIRONMENT || 'production');
    console.log('SSL:', process.env.DB_SSL === 'true');
    
    // For Supabase, we need to explicitly set SSL configuration
    let sslConfig = null;
    
    // Check if SSL is needed
    const needsSSL = connectionString.includes('sslmode=require') || 
                    process.env.DB_SSL === 'true' ||
                    process.env.CI === 'true';
    
    if (needsSSL) {
      console.log('🔐 Using SSL connection for Supabase');
      sslConfig = { 
        rejectUnauthorized: false,
        require: true
      };
    }
    
    this.pool = new Pool({
      connectionString,
      connectionTimeoutMillis: 30000,
      query_timeout: 60000,
      ...(sslConfig ? { ssl: sslConfig } : {})
    });
    
    this.outputDir = path.resolve(process.env.OUTPUT_DIR || path.join(__dirname, '..'));
    this.ensureDirectories();
  }
  
  ensureDirectories() {
    const dirs = ['', 'cheatsheets'];
    for (const dir of dirs) {
      const fullPath = path.join(this.outputDir, dir);
      if (!fs.existsSync(fullPath)) {
        fs.mkdirSync(fullPath, { recursive: true });
      }
    }
  }
  
  async generateAll() {
    let client;
    try {
      console.log('Attempting to connect to database...');
      client = await this.pool.connect();
      console.log('✅ Connected to database');
      
      const testQuery = await client.query('SELECT NOW() as current_time');
      console.log('Database time:', testQuery.rows[0].current_time);
      
      // Get tables in public schema
      console.log('📊 Fetching complete schema...');
      const tablesQuery = await client.query(`
        SELECT t.table_name,
               (SELECT COUNT(*)::int FROM information_schema.columns c 
                WHERE c.table_schema = 'public' 
                  AND c.table_name = t.table_name) as column_count
        FROM information_schema.tables t
        WHERE t.table_schema = 'public'
          AND t.table_type = 'BASE TABLE'
        ORDER BY t.table_name;
      `);
      
      const tables = tablesQuery.rows;
      console.log(`📋 Found ${tables.length} tables`);
      
      if (tables.length === 0) {
        console.warn('⚠️ No tables found in public schema');
      }
      
      const tableDetails = {};
      
      for (const t of tables) {
        const tableName = t.table_name;
        console.log(`   📝 Processing: ${tableName}`);
        
        // Get columns
        const columnsQ = await client.query(
          `SELECT column_name, data_type, is_nullable, column_default, ordinal_position
           FROM information_schema.columns
           WHERE table_schema = 'public' AND table_name = $1
           ORDER BY ordinal_position;`,
          [tableName]
        );
        
        // Get constraints
        const constraintsQ = await client.query(
          `
          SELECT
            tc.constraint_name,
            tc.constraint_type,
            kcu.column_name,
            pg_get_constraintdef(pc.oid) AS definition
          FROM information_schema.table_constraints tc
          LEFT JOIN information_schema.key_column_usage kcu
            ON tc.constraint_name = kcu.constraint_name AND tc.table_name = kcu.table_name AND tc.table_schema = kcu.table_schema
          LEFT JOIN pg_catalog.pg_constraint pc
            ON pc.conname = tc.constraint_name
          WHERE tc.table_schema = 'public' AND tc.table_name = $1;
          `,
          [tableName]
        );
        
        // Get row count safely using pg-format for identifier interpolation
        let rowCount = 0;
        try {
          const countSql = format('SELECT COUNT(*)::int AS cnt FROM %I.%I', 'public', tableName);
          const countRes = await client.query(countSql);
          rowCount = parseInt(countRes.rows[0].cnt, 10);
        } catch (err) {
          console.warn(`Could not get row count for ${tableName}: ${err.message}`);
          rowCount = 0;
        }
        
        tableDetails[tableName] = {
          columns: columnsQ.rows,
          constraints: constraintsQ.rows,
          row_count: rowCount,
          column_count: parseInt(t.column_count, 10)
        };
      }
      
      // Generate files
      await this.generateReadme(tables, tableDetails);
      await this.generateFullSchema(tables, tableDetails);
      await this.generateSchemaJson(tables, tableDetails);
      await this.generateQuickStart();
      await this.generateCheatsheets(tableDetails.properties || tableDetails['properties']);
      await this.generateAiPromptTemplate(tables, tableDetails);
      
      console.log('\n🎉 COMPLETE documentation generated!');
      console.log('📁 Location: ' + this.outputDir);
      
    } catch (error) {
      console.error('❌ Error:', error.message);
      console.error('Error stack:', error.stack);
      if (error.code) console.error('Error code:', error.code);
      throw error;
    } finally {
      try {
        if (client) {
          client.release();
        }
      } catch (e) {
        console.warn('Error releasing client:', e.message);
      }
      
      try {
        await this.pool.end();
      } catch (e) {
        console.warn('Error closing pool:', e.message);
      }
    }
  }
  
  async safeWrite(filename, content) {
    const filePath = path.join(this.outputDir, filename);
    try {
      await fsp.writeFile(filePath, content, 'utf8');
      console.log(`✅ Created ${filename}`);
    } catch (err) {
      console.error(`Failed to write ${filename}:`, err.message);
      throw err;
    }
  }
  
  async generateReadme(tables, tableDetails) {
    const totalColumns = tables.reduce((sum, t) => sum + (Number(t.column_count) || 0), 0);
    const props = tableDetails.properties || {};
    const tableRows = tables.map(t => {
      const rows = (tableDetails[t.table_name] && typeof tableDetails[t.table_name].row_count === 'number')
        ? `~${tableDetails[t.table_name].row_count.toLocaleString()}`
        : '~0';
      return `| \`${t.table_name}\` | ${t.column_count} | ${rows} |`;
    }).join('\n');
    
    const content = `# 🏠 WHYNOTBROKER Database Documentation
> **Live, auto-updated database reference**  
> Generated: ${new Date().toISOString()}
> Environment: ${process.env.DB_ENVIRONMENT || 'production'}

## 📊 Quick Stats
- **Total Tables:** ${tables.length}
- **Total Columns:** ${totalColumns}
- **Main Table:** \`properties\` (${props.column_count || 0} columns, ${props.row_count || 0} rows)

## 🚀 Getting Started
1. **New Developer?** → Read [QUICK-START.md](./QUICK-START.md) (5 minutes)
2. **Need Full Details?** → Read [FULL-SCHEMA.md](./FULL-SCHEMA.md)
3. **Stuck with Errors?** → Check [COMMON-ERRORS.md](./COMMON-ERRORS.md)
4. **Working with AI?** → Use [ai-prompt-template.md](./ai-prompt-template.md)

## 📁 Documentation Structure
\`\`\`
/whynotbroker-database-docs/
├── 📄 README.md
├── 📄 FULL-SCHEMA.md
├── 📄 QUICK-START.md
├── 📄 COMMON-ERRORS.md
├── 📄 schema.json
├── 📄 examples.json
├── 📄 constraints.json
├── 📄 relationships.json
├── 📄 changelog.json
├── 📄 ai-prompt-template.md
├── 📊 schema-diagram.svg
└── 📁 cheatsheets/
    ├── insert-property.md
    ├── query-properties.md
    └── update-property.md
\`\`\`

## 🔄 Auto-Update Schedule
This documentation updates:
- **Daily** at 6:00 AM UTC via GitHub Actions
- **On-demand** via manual trigger
- **After schema changes** via webhook

## 📋 Table Summary
| Table | Columns | Rows |
|-------|---------|------|
${tableRows}

---
*This documentation is auto-generated. Manual edits will be overwritten.*`;
    
    await this.safeWrite('README.md', content);
  }
  
  async generateFullSchema(tables, tableDetails) {
    let content = `# WHYNOTBROKER - Full Database Schema
> Auto-generated on: ${new Date().toISOString()}
> **Total Tables:** ${tables.length}
> **Environment:** ${process.env.DB_ENVIRONMENT || 'production'}

## Overview
This document details the live schema of the production Supabase database. All API backend code must align with the structures and rules defined here.

---

## Core Tables

`;
    
    for (const t of tables) {
      const name = t.table_name;
      const details = tableDetails[name] || { columns: [], constraints: [], row_count: 0, column_count: 0 };
      
      content += `### \`${name}\`\n`;
      content += `**Rows:** ~${(details.row_count || 0).toLocaleString()}  \n`;
      content += `**Columns:** ${details.column_count}\n\n`;
      
      if (details.columns && details.columns.length > 0) {
        content += `| Column | Type | Nullable | Default |\n`;
        content += `|--------|------|----------|---------|\n`;
        
        details.columns.forEach(col => {
          content += `| \`${col.column_name}\` | \`${col.data_type}\` | ${col.is_nullable} | \`${col.column_default || '—'}\` |\n`;
        });
      }
      
      if (details.constraints && details.constraints.length > 0) {
        content += `\n**Constraints:**\n`;
        details.constraints.forEach(con => {
          if (con.definition) {
            content += `- \`${con.constraint_name}\`: ${con.definition}\n`;
          }
        });
      }
      
      content += '\n---\n\n';
    }
    
    await this.safeWrite('FULL-SCHEMA.md', content);
  }
  
  async generateSchemaJson(tables, tableDetails) {
    const schema = {
      generated_at: new Date().toISOString(),
      database: 'WHYNOTBROKER',
      environment: process.env.DB_ENVIRONMENT || 'production',
      tables: tables.map(t => ({
        name: t.table_name,
        columns: Number(t.column_count) || 0,
        rows: tableDetails[t.table_name]?.row_count || 0,
        details: tableDetails[t.table_name] || {}
      }))
    };
    
    await this.safeWrite('schema.json', JSON.stringify(schema, null, 2));
  }
  
  async generateQuickStart() {
    const content = `# 🚀 Quick Start Guide - WHYNOTBROKER Database
