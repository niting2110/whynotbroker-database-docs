name: "📚 Generate Database Documentation"

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC (11:30 AM IST)
  workflow_dispatch:      # Manual trigger
    inputs:
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Environment to document'
        required: false
        type: choice
        options:
          - production
          - staging
          - development
        default: 'production'
  push:
    branches: [ main, master ]
    paths:
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/db-docs.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'supabase/**'

concurrency:
  group: db-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-db-docs:
    name: Generate Documentation - ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      CI: true
      NODE_ENV: production
      TZ: Asia/Kolkata
      DB_SSL: true
      OUTPUT_DIR: './docs/database'
      DB_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'scripts/package-lock.json'

      - name: 📦 Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            scripts/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('scripts/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('scripts/package-lock.json') }}
            ${{ runner.os }}-node-

      - name: 🔐 Configure Database Credentials
        id: configure-db
        continue-on-error: false
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'production' }}"
          echo "Selected environment: $TARGET_ENV"

          case "$TARGET_ENV" in
            "production")
              echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
              echo "Using production database"
              ;;
            "staging")
              echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL || secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
              echo "Using staging database (fallback to production if not configured)"
              ;;
            "development")
              echo "DATABASE_URL=${{ secrets.DEVELOPMENT_DATABASE_URL || secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
              echo "Using development database (fallback to production if not configured)"
              ;;
            *)
              echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
              echo "Using production database (default)"
              ;;
          esac

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL is not configured for environment: $TARGET_ENV"
            exit 1
          fi

          echo "DB environment set to: $TARGET_ENV"

      - name: 📦 Install dependencies (lightweight / resilient)
        working-directory: scripts
        id: install-deps
        continue-on-error: false
        run: |
          echo "Installing dependencies (lightweight CI mode)..."
          if [ -f "package.json" ]; then
            npm ci --prefer-offline --no-audit --no-fund --no-progress
          else
            echo "package.json not found — performing minimal runtime installs"
            npm init -y >/dev/null 2>&1
            npm install pg dotenv pg-format --no-save --no-audit --no-fund --no-progress
            rm -f package.json package-lock.json
          fi

          if ! node -e "require('pg-format'); process.exit(0)" 2>/dev/null; then
            echo "pg-format missing — installing..."
            npm install pg-format --no-save --no-audit --no-fund --no-progress
          fi

          echo "✅ Dependencies installed successfully"

      - name: 📝 Generate documentation
        id: generate-docs
        working-directory: scripts
        continue-on-error: false
        run: |
          # Set local shell variables from GitHub expressions
          ENVIRONMENT="${{ github.event.inputs.environment || 'production' }}"
          TRIGGER="${{ github.event_name }}"
          FORCE_UPDATE="${{ github.event.inputs.force_update || 'false' }}"
          GITHUB_RUN_ID="${{ github.run_id }}"
          GITHUB_RUN_NUMBER="${{ github.run_number }}"

          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          LOG_FILE="generation-$TIMESTAMP.log"
          REPORT_FILE="generation-report-$TIMESTAMP.json"

          echo "🚀 Starting database documentation generation..."
          echo "Environment: $ENVIRONMENT"
          echo "Force update: $FORCE_UPDATE"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Timestamp: $TIMESTAMP UTC"
          echo "Node: $(node --version)"

          START_TIME=$(date +%s)

          if timeout 600 node generate-complete-docs.js 2>&1 | tee "$LOG_FILE"; then
            EXIT_CODE=0
          else
            EXIT_CODE=${PIPESTATUS[0]:-1}
          fi

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          echo ""
          echo "=== Generation Summary ==="
          echo "Exit Code: $EXIT_CODE"
          echo "Duration: ${DURATION}s"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          cat > "$REPORT_FILE" <<EOF
{
  "run_id": "${GITHUB_RUN_ID}",
  "environment": "${ENVIRONMENT}",
  "timestamp": "$(date -u -Iseconds)",
  "duration_seconds": ${DURATION},
  "exit_code": ${EXIT_CODE},
  "force_update": ${FORCE_UPDATE},
  "node_version": "$(node --version)",
  "trigger": "${TRIGGER}"
}
EOF

          echo "log_file=$LOG_FILE" >> $GITHUB_OUTPUT
          echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Documentation generation failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

      - name: 🔍 Analyze changes
        id: check-changes
        if: ${{ success() }}
        run: |
          git status --porcelain > /tmp/git-status.txt || true

          if grep -q '.' /tmp/git-status.txt; then
            echo "✅ Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT

            mkdir -p changes
            git status --porcelain > changes/modified-files.txt
            git add -A "${{ env.OUTPUT_DIR }}" || true
            git diff --cached --numstat > changes/numstat.txt || true

            ADDED=$(awk '{sum+=$1} END {print sum+0}' changes/numstat.txt || echo "0")
            REMOVED=$(awk '{sum+=$2} END {print sum+0}' changes/numstat.txt || echo "0")
            FILES=$(wc -l < changes/modified-files.txt || echo "0")

            echo "changes_added=$ADDED" >> $GITHUB_OUTPUT
            echo "changes_removed=$REMOVED" >> $GITHUB_OUTPUT
            echo "changes_files=$FILES" >> $GITHUB_OUTPUT

            {
              echo "## 📊 Change Summary"
              echo ""
              echo "**Total Files:** $FILES"
              echo "**Lines Added:** +$ADDED"
              echo "**Lines Removed:** -$REMOVED"
              echo ""
              echo "### Modified Files:"
              echo '```'
              cat changes/modified-files.txt
              echo '```'
            } > changes/summary.md

            git status --short
          else
            echo "ℹ️ No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "changes_added=0" >> $GITHUB_OUTPUT
            echo "changes_removed=0" >> $GITHUB_OUTPUT
            echo "changes_files=0" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Generate metrics
        if: ${{ success() }}
        id: metrics
        run: |
          METRICS_FILE="metrics-${{ github.run_id }}.json"

          DOCS_SIZE=$(du -sk "${{ env.OUTPUT_DIR }}" 2>/dev/null | cut -f1 || echo "0")
          CHEATSHEETS_COUNT=$(find "${{ env.OUTPUT_DIR }}/cheatsheets" -name "*.md" 2>/dev/null | wc -l || echo "0")
          EXPORTS_COUNT=$(find "${{ env.OUTPUT_DIR }}/exports" -type f 2>/dev/null | wc -l || echo "0")
          SCHEMA_HASH=$(cat "${{ env.OUTPUT_DIR }}/.schema-hash" 2>/dev/null | head -1 || echo "unknown")

          cat > "$METRICS_FILE" <<EOF
{
  "run_id": "${{ github.run_id }}",
  "generated_at": "$(date -u -Iseconds)",
  "environment": "${{ env.DB_ENVIRONMENT }}",
  "duration_seconds": ${{ steps.generate-docs.outputs.duration || 0 }},
  "has_changes": ${{ steps.check-changes.outputs.has_changes == 'true' }},
  "changes": {
    "files": ${{ steps.check-changes.outputs.changes_files || 0 }},
    "lines_added": ${{ steps.check-changes.outputs.changes_added || 0 }},
    "lines_removed": ${{ steps.check-changes.outputs.changes_removed || 0 }}
  },
  "output": {
    "docs_size_kb": $DOCS_SIZE,
    "cheatsheets_count": $CHEATSHEETS_COUNT,
    "exports_count": $EXPORTS_COUNT,
    "schema_hash": "$SCHEMA_HASH"
  }
}
EOF

          echo "metrics_file=$METRICS_FILE" >> $GITHUB_OUTPUT
          echo "Generated metrics file: $METRICS_FILE"

      - name: 💾 Commit and push
        id: commit
        if: ${{ steps.check-changes.outputs.has_changes == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true

          COMMIT_MSG="📚 db: auto-update documentation

• Environment: ${{ env.DB_ENVIRONMENT }}
• Files changed: ${{ steps.check-changes.outputs.changes_files || 0 }}
• Lines: +${{ steps.check-changes.outputs.changes_added || 0 }}/-${{ steps.check-changes.outputs.changes_removed || 0 }}

Generated by GitHub Actions:
• Run: #${{ github.run_number }}
• ID: ${{ github.run_id }}
• Trigger: ${{ github.event_name }}

Schema Hash: $(cat "${{ env.OUTPUT_DIR }}/.schema-hash" 2>/dev/null || echo 'unknown')

Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git add -A "${{ env.OUTPUT_DIR }}" || true
          git add changes/ || true

          if ! git diff --cached --quiet; then
            echo "Committing changes..."
            git commit -m "$COMMIT_MSG"

            MAX_RETRIES=3
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Push attempt $i/$MAX_RETRIES..."
              if git push; then
                echo "✅ Changes pushed successfully"
                echo "pushed=true" >> $GITHUB_OUTPUT
                break
              else
                if [ $i -eq $MAX_RETRIES ]; then
                  echo "❌ Failed to push after $MAX_RETRIES attempts"
                  exit 1
                fi
                echo "Pull latest changes and retry..."
                sleep 2
                git pull --rebase --autostash || true
              fi
            done
          else
            echo "No staged changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-docs-${{ github.run_id }}-${{ env.DB_ENVIRONMENT }}
          path: |
            scripts/${{ steps.generate-docs.outputs.log_file }}
            scripts/${{ steps.generate-docs.outputs.report_file }}
            ${{ steps.metrics.outputs.metrics_file || '' }}
            changes/
            ${{ env.OUTPUT_DIR }}/validation-report.md
            ${{ env.OUTPUT_DIR }}/schema.json
          retention-days: 30
          if-no-files-found: warn

      - name: 📊 Upload docs snapshot
        if: ${{ steps.generate-docs.outputs.exit_code == '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-snapshot-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: 7
          if-no-files-found: warn

      - name: 📋 Create workflow summary
        if: always()
        run: |
          STATUS=${{ job.status }}
          EXIT_CODE=${{ steps.generate-docs.outputs.exit_code || 'N/A' }}
          DURATION=${{ steps.generate-docs.outputs.duration || 'N/A' }}
          HAS_CHANGES=${{ steps.check-changes.outputs.has_changes || 'false' }}
          PUSHED=${{ steps.commit.outputs.pushed || 'false' }}

          {
            echo "# 📚 Database Documentation - ${{ env.DB_ENVIRONMENT }}"
            echo ""
            echo "**Status:** $STATUS"

            if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "N/A" ]; then
              echo "❌ **Exit Code:** $EXIT_CODE"
            else
              echo "✅ **Exit Code:** $EXIT_CODE"
            fi

            echo ""
            echo "## 📊 Execution Details"
            echo "- **Trigger:** \`${{ github.event_name }}\`"
            echo "- **Environment:** \`${{ env.DB_ENVIRONMENT }}\`"
            echo "- **Duration:** ${DURATION}s"
            echo "- **Run:** [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- **Branch:** \`${{ github.ref_name }}\`"

            if [ "$HAS_CHANGES" == "true" ]; then
              echo ""
              echo "## 🔄 Changes Detected"
              echo "- **Files changed:** ${{ steps.check-changes.outputs.changes_files || 0 }}"
              echo "- **Lines added:** +${{ steps.check-changes.outputs.changes_added || 0 }}"
              echo "- **Lines removed:** -${{ steps.check-changes.outputs.changes_removed || 0 }}"

              if [ "$PUSHED" == "true" ]; then
                echo "- **✅ Changes committed and pushed**"
              else
                echo "- **⚠️ Changes detected but not pushed**"
              fi
            else
              echo ""
              echo "## ✅ No Schema Changes"
              echo "Database schema is unchanged since last documentation generation."
            fi

            if [ "$EXIT_CODE" == "0" ] && [ -f "scripts/${{ steps.generate-docs.outputs.report_file }}" ]; then
              echo ""
              echo "## 📈 Generated Reports"
              echo "- [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              echo "- [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)"
            fi

            echo ""
            echo "---"
            echo "*Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*"
          } >> $GITHUB_STEP_SUMMARY