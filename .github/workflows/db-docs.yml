name: "📚 Generate Database Documentation (minimal, validated)"

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  generate-db-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install minimal runtime deps (CI-only)
        working-directory: scripts
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund --no-progress
          else
            npm init -y >/dev/null 2>&1
            npm install pg dotenv pg-format --no-save --no-audit --no-fund --no-progress
            rm -f package.json package-lock.json
          fi

      - name: Run generator (requires PRODUCTION_DATABASE_URL secret)
        id: generate
        working-directory: scripts
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          # Optional: pass force flag from dispatch (if present)
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        run: |
          set -euo pipefail
          # Basic validation
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL environment variable is not set. Add PRODUCTION_DATABASE_URL to repo secrets."
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          LOG_FILE="generation-${TIMESTAMP}.log"
          REPORT_FILE="generation-report-${TIMESTAMP}.json"

          echo "Starting generator (run id: ${{ github.run_id }})"
          START=$(date +%s)
          if timeout 600 node generate-complete-docs.js 2>&1 | tee "${LOG_FILE}"; then
            EXIT_CODE=0
          else
            EXIT_CODE=${PIPESTATUS[0]:-1}
          fi
          END=$(date +%s)
          DURATION=$((END - START))

          # Small JSON report (shell vars only)
          cat > "${REPORT_FILE}" <<EOF
{
  "run_id": "${{ github.run_id }}",
  "duration_seconds": ${DURATION},
  "exit_code": ${EXIT_CODE}
}
EOF

          echo "log_file=${LOG_FILE}" >> "$GITHUB_OUTPUT"
          echo "report_file=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
          echo "duration=${DURATION}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ "${EXIT_CODE}" -ne 0 ]; then
            echo "::error::Generator exited with code ${EXIT_CODE}"
            exit "${EXIT_CODE}"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-docs-${{ github.run_id }}
          path: |
            scripts/${{ steps.generate.outputs.log_file }}
            scripts/${{ steps.generate.outputs.report_file }}
          retention-days: 7
          if-no-files-found: warn