name: 📚 Generate Database Documentation

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC (11:30 AM IST)
  workflow_dispatch:      # Manual trigger
    inputs:
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Environment to document'
        required: false
        type: choice
        options:
          - production
          - staging
          - development
        default: 'production'
  push:
    branches: [ main, master ]
    paths:
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/db-docs.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'supabase/**'

# Prevent concurrent runs
concurrency:
  group: db-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-db-docs:
    name: Generate Documentation - ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      CI: true
      NODE_ENV: production
      TZ: Asia/Kolkata  # Set timezone for consistent timestamps
      DB_SSL: true
      OUTPUT_DIR: './docs/database'  # Structured output directory
      DB_ENVIRONMENT: ${{ inputs.environment || 'production' }}

    steps:
      # ===================================================================
      # STEP 1: Setup and Preparation
      # ===================================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'scripts/package-lock.json'

      - name: 📦 Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            scripts/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('scripts/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('scripts/package-lock.json') }}
            ${{ runner.os }}-node-

      - name: 🔐 Configure Database Credentials
        id: configure-db
        continue-on-error: false
        run: |
          # Select database URL based on environment
          case "${{ inputs.environment || 'production' }}" in
            "production")
              echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
              echo "Using production database"
              ;;
            "staging")
              echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
              echo "Using production database (staging not configured)"
              ;;
            "development")
              echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
              echo "Using production database (dev not configured)"
              ;;
            *)
              echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
              echo "Using production database (default)"
              ;;
          esac
          
          # Verify database URL is set
          if [ -z "${DATABASE_URL}" ]; then
            echo "❌ ERROR: DATABASE_URL is not set for environment: ${{ inputs.environment || 'production' }}"
            echo "::error::Database URL not configured for this environment"
            exit 1
          fi

          echo "Database URL configured successfully"
          echo "DB environment: ${{ inputs.environment || 'production' }}"

      - name: 📦 Install dependencies
        working-directory: scripts
        id: install-deps
        continue-on-error: false
        run: |
          # Clean install
          echo "Installing dependencies..."
          
          # Check if package.json exists
          if [ ! -f "package.json" ]; then
            echo "❌ package.json not found in scripts directory!"
            echo "::error::package.json not found"
            exit 1
          fi
          
          # Install dependencies
          npm ci --prefer-offline --no-audit --no-fund --no-progress
          
          # Verify pg-format is installed
          if ! npm list pg-format; then
            echo "Installing pg-format..."
            npm install pg-format --no-save --no-audit --no-fund
          fi
          
          echo "✅ Dependencies installed successfully"

      # ===================================================================
      # STEP 2: Generate Documentation
      # ===================================================================
      - name: 📝 Generate documentation
        id: generate-docs
        working-directory: scripts
        env:
          FORCE_UPDATE: ${{ inputs.force_update }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        continue-on-error: true
        run: |
          set -e
          
          # Create timestamp for this run
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          LOG_FILE="generation-$TIMESTAMP.log"
          REPORT_FILE="generation-report-$TIMESTAMP.json"
          
          echo "🚀 Starting database documentation generation..."
          echo "Environment: ${{ env.DB_ENVIRONMENT }}"
          echo "Force update: ${{ inputs.force_update }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Timestamp: $TIMESTAMP UTC"
          echo "Node: $(node --version)"
          
          # Start timing
          START_TIME=$(date +%s)
          
          # Run with timeout and capture output
          {
            timeout 600 node generate-complete-docs.js 2>&1
            EXIT_CODE=$?
            
            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))
            
            echo ""
            echo "=== Generation Summary ==="
            echo "Exit Code: $EXIT_CODE"
            echo "Duration: ${DURATION}s"
            echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            
            # Create report
            cat > "$REPORT_FILE" << EOF
            {
              "run_id": "${{ github.run_id }}",
              "environment": "${{ env.DB_ENVIRONMENT }}",
              "timestamp": "$(date -u -Iseconds)",
              "duration_seconds": $DURATION,
              "exit_code": $EXIT_CODE,
              "force_update": ${{ inputs.force_update }},
              "node_version": "$(node --version)",
              "trigger": "${{ github.event_name }}"
            }
            EOF
            
            # Exit with original code
            exit $EXIT_CODE
          } | tee "$LOG_FILE"
          
          # Capture exit code
          EXIT_CODE=${PIPESTATUS[0]}
          
          # Set outputs
          echo "log_file=$LOG_FILE" >> $GITHUB_OUTPUT
          echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          # Fail if non-zero exit
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Documentation generation failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      # ===================================================================
      # STEP 3: Process Results
      # ===================================================================
      - name: 🔍 Analyze changes
        id: check-changes
        if: steps.generate-docs.outputs.exit_code == '0'
        run: |
          # Create changes directory for better organization
          mkdir -p changes
          
          # Check for changes
          if git status --porcelain | grep -q "."; then
            echo "✅ Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            # Get detailed changes
            git status --porcelain > changes/modified-files.txt
            git diff --cached --numstat > changes/numstat.txt
            
            # Calculate statistics
            ADDED=$(awk '{sum+=$1} END {print sum}' changes/numstat.txt || echo "0")
            REMOVED=$(awk '{sum+=$2} END {print sum}' changes/numstat.txt || echo "0")
            FILES=$(wc -l < changes/modified-files.txt || echo "0")
            
            echo "changes_added=$ADDED" >> $GITHUB_OUTPUT
            echo "changes_removed=$REMOVED" >> $GITHUB_OUTPUT
            echo "changes_files=$FILES" >> $GITHUB_OUTPUT
            
            # Generate change summary
            {
              echo "## 📊 Change Summary"
              echo ""
              echo "**Total Files:** $FILES"
              echo "**Lines Added:** +$ADDED"
              echo "**Lines Removed:** -$REMOVED"
              echo ""
              echo "### Modified Files:"
              echo '```'
              cat changes/modified-files.txt
              echo '```'
            } > changes/summary.md
            
            # Show what changed in logs
            echo "=== Change Details ==="
            git status --short
            
          else
            echo "ℹ️ No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No modifications to database documentation"
          fi

      - name: 📊 Generate metrics
        if: steps.generate-docs.outputs.exit_code == '0'
        id: metrics
        run: |
          # Create metrics file
          METRICS_FILE="metrics-${{ github.run_id }}.json"
          
          # Calculate folder sizes
          DOCS_SIZE=$(du -sk docs/database 2>/dev/null | cut -f1 || echo "0")
          CHEATSHEETS_COUNT=$(find docs/database/cheatsheets -name "*.md" 2>/dev/null | wc -l || echo "0")
          EXPORTS_COUNT=$(find docs/database/exports -type f 2>/dev/null | wc -l || echo "0")
          
          # Get latest schema hash
          SCHEMA_HASH=$(cat docs/database/.schema-hash 2>/dev/null | head -1 || echo "unknown")
          
          cat > "$METRICS_FILE" << EOF
          {
            "run_id": "${{ github.run_id }}",
            "generated_at": "$(date -u -Iseconds)",
            "environment": "${{ env.DB_ENVIRONMENT }}",
            "duration_seconds": ${{ steps.generate-docs.outputs.duration || 0 }},
            "has_changes": ${{ steps.check-changes.outputs.has_changes == 'true' }},
            "changes": {
              "files": ${{ steps.check-changes.outputs.changes_files || 0 }},
              "lines_added": ${{ steps.check-changes.outputs.changes_added || 0 }},
              "lines_removed": ${{ steps.check-changes.outputs.changes_removed || 0 }}
            },
            "output": {
              "docs_size_kb": $DOCS_SIZE,
              "cheatsheets_count": $CHEATSHEETS_COUNT,
              "exports_count": $EXPORTS_COUNT,
              "schema_hash": "$SCHEMA_HASH"
            }
          }
          EOF
          
          echo "metrics_file=$METRICS_FILE" >> $GITHUB_OUTPUT
          echo "Generated metrics file: $METRICS_FILE"

      # ===================================================================
      # STEP 4: Commit Changes (if any)
      # ===================================================================
      - name: 💾 Commit and push
        id: commit
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          
          # Create structured commit message
          COMMIT_MSG="📚 db: auto-update documentation
          
          ## Summary
          • Environment: ${{ env.DB_ENVIRONMENT }}
          • Files changed: ${{ steps.check-changes.outputs.changes_files || 0 }}
          • Lines: +${{ steps.check-changes.outputs.changes_added || 0 }}/-${{ steps.check-changes.outputs.changes_removed || 0 }}
          
          ## Details
          Generated by GitHub Actions workflow:
          • Run: #${{ github.run_number }}
          • ID: ${{ github.run_id }}
          • Trigger: ${{ github.event_name }}
          
          ## Schema Hash
          $(cat docs/database/.schema-hash 2>/dev/null || echo 'unknown')
          
          Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          
          # Stage changes
          git add -A
          
          # Check if there are staged changes
          if ! git diff --cached --quiet; then
            echo "Committing changes..."
            git commit -m "$COMMIT_MSG"
            
            # Push with retry
            MAX_RETRIES=3
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Push attempt $i/$MAX_RETRIES..."
              if git push; then
                echo "✅ Changes pushed successfully"
                echo "pushed=true" >> $GITHUB_OUTPUT
                break
              else
                if [ $i -eq $MAX_RETRIES ]; then
                  echo "❌ Failed to push after $MAX_RETRIES attempts"
                  exit 1
                fi
                echo "Pull latest changes and retry..."
                sleep 2
                git pull --rebase --autostash
              fi
            done
          else
            echo "No staged changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      # ===================================================================
      # STEP 5: Artifacts and Reports
      # ===================================================================
      - name: 📤 Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-docs-${{ github.run_id }}-${{ env.DB_ENVIRONMENT }}
          path: |
            scripts/${{ steps.generate-docs.outputs.log_file }}
            scripts/${{ steps.generate-docs.outputs.report_file }}
            scripts/${{ steps.metrics.outputs.metrics_file }}
            changes/
            docs/database/validation-report.md
            docs/database/schema.json
          retention-days: 30
          if-no-files-found: warn

      - name: 📊 Upload docs snapshot
        if: steps.generate-docs.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: docs-snapshot-${{ github.run_id }}
          path: docs/database/
          retention-days: 7
          if-no-files-found: warn

      # ===================================================================
      # STEP 6: Create GitHub Summary
      # ===================================================================
      - name: 📋 Create workflow summary
        if: always()
        run: |
          STATUS=${{ job.status }}
          EXIT_CODE=${{ steps.generate-docs.outputs.exit_code || 'N/A' }}
          DURATION=${{ steps.generate-docs.outputs.duration || 'N/A' }}
          HAS_CHANGES=${{ steps.check-changes.outputs.has_changes || 'false' }}
          PUSHED=${{ steps.commit.outputs.pushed || 'false' }}
          
          {
            echo "# 📚 Database Documentation - ${{ env.DB_ENVIRONMENT }}"
            echo ""
            echo "**Status:** $STATUS"
            
            if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "N/A" ]; then
              echo "❌ **Exit Code:** $EXIT_CODE"
            else
              echo "✅ **Exit Code:** $EXIT_CODE"
            fi
            
            echo ""
            echo "## 📊 Execution Details"
            echo "- **Trigger:** \`${{ github.event_name }}\`"
            echo "- **Environment:** \`${{ env.DB_ENVIRONMENT }}\`"
            echo "- **Duration:** ${DURATION}s"
            echo "- **Run:** [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            
            if [ "$HAS_CHANGES" == "true" ]; then
              echo ""
              echo "## 🔄 Changes Detected"
              echo "- **Files changed:** ${{ steps.check-changes.outputs.changes_files || 0 }}"
              echo "- **Lines added:** +${{ steps.check-changes.outputs.changes_added || 0 }}"
              echo "- **Lines removed:** -${{ steps.check-changes.outputs.changes_removed || 0 }}"
              
              if [ "$PUSHED" == "true" ]; then
                echo "- **✅ Changes committed and pushed**"
              else
                echo "- **⚠️ Changes detected but not pushed**"
              fi
            else
              echo ""
              echo "## ✅ No Schema Changes"
              echo "Database schema is unchanged since last documentation generation."
            fi
            
            if [ "$EXIT_CODE" == "0" ] && [ -f "scripts/${{ steps.generate-docs.outputs.report_file }}" ]; then
              echo ""
              echo "## 📈 Generated Reports"
              echo "- [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              echo "- [Download Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)"
            fi
            
            echo ""
            echo "---"
            echo "*Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')*"
          } >> $GITHUB_STEP_SUMMARY

      # ===================================================================
      # STEP 7: Notifications (Optional)
      # ===================================================================
      - name: 📢 Send Slack notification
        if: always() && (failure() || steps.check-changes.outputs.has_changes == 'true')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            STATUS="${{ job.status }}"
            CHANGES="${{ steps.check-changes.outputs.has_changes == 'true' }}"
            ENVIRONMENT="${{ env.DB_ENVIRONMENT }}"
            
            # Prepare message based on status
            if [ "$STATUS" = "success" ]; then
              if [ "$CHANGES" = "true" ]; then
                COLOR="#36a64f"  # Green
                TITLE="✅ Database Docs Updated"
                TEXT="Database documentation for *${ENVIRONMENT}* has been updated."
              else
                COLOR="#2eb886"  # Light green
                TITLE="✅ Database Docs Checked"
                TEXT="Database schema for *${ENVIRONMENT}* is unchanged."
              fi
            else
              COLOR="#ff0000"  # Red
              TITLE="❌ Database Docs Failed"
              TEXT="Documentation generation for *${ENVIRONMENT}* failed."
            fi
            
            # Build Slack message
            cat > slack-message.json << 'EOF'
            {
              "attachments": [
                {
                  "color": "${COLOR}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "${TITLE}"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Environment:*\n${ENVIRONMENT}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Status:*\n${STATUS}"
                        }
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${TEXT}\n\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                      }
                    }
                  ]
                }
              ]
            }
            EOF
            
            # Send to Slack
            curl -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @slack-message.json
            
            echo "Slack notification sent"
          else
            echo "No Slack webhook configured"
          fi

      - name: 🎫 Create GitHub Issue on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            
            const issueTitle = `🚨 Database documentation generation failed for ${process.env.DB_ENVIRONMENT}`;
            
            const issueBody = `
            ## Database Documentation Generation Failed
            
            **Environment:** ${process.env.DB_ENVIRONMENT}
            **Workflow:** ${context.workflow}
            **Run:** [#${context.runNumber}](${runUrl})
            **Branch:** ${context.ref}
            
            ### Next Steps:
            1. Check the workflow logs for errors
            2. Verify database connection settings
            3. Ensure the documentation script is working
            
            ### Error Details:
            Please check the workflow run for detailed error information.
            
            ---
            
            *This issue was auto-generated by GitHub Actions.*
            `;
            
            await github.rest.issues.create({
              owner,
              repo,
              title: issueTitle,
              body: issueBody,
              labels: ['bug', 'documentation', 'automated']
            });

  # ===================================================================
  # OPTIONAL: Security Scan for Generated Docs
  # ===================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: generate-db-docs
    if: always() && needs.generate-db-docs.result == 'success'
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🔍 Scan for sensitive data
        run: |
          echo "Scanning generated documentation for sensitive data..."
          
          # Check for potential secrets
          if grep -r "password\|secret\|key\|token" docs/database/ --include="*.md" --include="*.json" | grep -v "password=***" | grep -v "example"; then
            echo "::warning::Potential secrets found in generated docs"
            echo "Found potential secrets in:"
            grep -r "password\|secret\|key\|token" docs/database/ --include="*.md" --include="*.json" | grep -v "password=***" | grep -v "example"
          else
            echo "✅ No sensitive data detected"
          fi
          
          # Check file permissions
          echo "Checking file permissions..."
          find docs/database/ -type f -name "*.json" -exec stat -c "%a %n" {} \; | grep -v "^644" && echo "::warning::Some JSON files have unusual permissions"