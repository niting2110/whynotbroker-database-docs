name: "📚 Generate Database Documentation"

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to document'
        required: false
        type: choice
        options:
          - production
          - staging
          - development
        default: production
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    paths:
      - 'scripts/**'
      - 'supabase/**'
      - '.github/workflows/db-docs.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'supabase/**'

jobs:
  generate-db-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    env:
      OUTPUT_DIR: './docs/database'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (lightweight)
        working-directory: scripts
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund --no-progress
          else
            # Minimal runtime install for CI-only mode (no repo mutation)
            npm init -y >/dev/null 2>&1
            npm install pg dotenv pg-format --no-save --no-audit --no-fund --no-progress
            rm -f package.json package-lock.json
          fi

      - name: Run generator
        id: generate
        working-directory: scripts
        env:
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_FORCE_UPDATE: ${{ github.event.inputs.force_update }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          ENVIRONMENT="${INPUT_ENVIRONMENT:-production}"
          FORCE_UPDATE="${INPUT_FORCE_UPDATE:-false}"
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          LOG_FILE="generation-${TIMESTAMP}.log"
          REPORT_FILE="generation-report-${TIMESTAMP}.json"

          echo "Environment: ${ENVIRONMENT}"
          echo "Force update: ${FORCE_UPDATE}"
          echo "Run ID: ${RUN_ID}"
          echo "Starting generator..."

          START=$(date +%s)
          if timeout 600 node generate-complete-docs.js 2>&1 | tee "${LOG_FILE}"; then
            EXIT_CODE=0
          else
            EXIT_CODE=${PIPESTATUS[0]:-1}
          fi
          END=$(date +%s)
          DURATION=$((END - START))

          # Write a simple JSON report using only shell vars (no GitHub expressions inside)
          cat > "${REPORT_FILE}" <<EOF
{
  "run_id": "${RUN_ID}",
  "environment": "${ENVIRONMENT}",
  "timestamp": "$(date -u -Iseconds)",
  "duration_seconds": ${DURATION},
  "exit_code": ${EXIT_CODE},
  "force_update": "${FORCE_UPDATE}"
}
EOF

          # Export outputs
          echo "log_file=${LOG_FILE}" >> $GITHUB_OUTPUT
          echo "report_file=${REPORT_FILE}" >> $GITHUB_OUTPUT
          echo "duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT

          if [ "${EXIT_CODE}" -ne 0 ]; then
            echo "::error::Generator exited with code ${EXIT_CODE}"
            exit "${EXIT_CODE}"
          fi

      - name: Stage output for diff
        run: |
          set -euo pipefail
          # Ensure OUTPUT_DIR exists to avoid git add failure
          mkdir -p "${{ env.OUTPUT_DIR }}"
          git add -A "${{ env.OUTPUT_DIR }}" || true

      - name: Check for staged changes
        id: check
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "changes_files=0" >> $GITHUB_OUTPUT
            echo "changes_added=0" >> $GITHUB_OUTPUT
            echo "changes_removed=0" >> $GITHUB_OUTPUT
          else
            # gather stats
            git diff --cached --numstat > /tmp/changes-numstat.txt || true
            FILES=$(git diff --cached --name-only | wc -l || true)
            ADDED=$(awk '{sum+=$1} END {print sum+0}' /tmp/changes-numstat.txt || echo 0)
            REMOVED=$(awk '{sum+=$2} END {print sum+0}' /tmp/changes-numstat.txt || echo 0)

            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changes_files=${FILES}" >> $GITHUB_OUTPUT
            echo "changes_added=${ADDED}" >> $GITHUB_OUTPUT
            echo "changes_removed=${REMOVED}" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push (if changes)
        if: ${{ steps.check.outputs.has_changes == 'true' }}
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git commit -m "📚 Auto-update database docs (run ${{ github.run_number }})" || echo "No changes to commit"
          git push || (git pull --rebase && git push) || echo "Push failed (non-fatal)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-docs-${{ github.run_id }}
          path: |
            scripts/${{ steps.generate.outputs.log_file }}
            scripts/${{ steps.generate.outputs.report_file }}
          retention-days: 7
          if-no-files-found: warn

      - name: Workflow summary
        if: always()
        run: |
          echo "## Database Docs" >> $GITHUB_STEP_SUMMARY
          echo "- Run: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: ${{ steps.generate.outputs.duration }}s" >> $GITHUB_STEP_SUMMARY
          echo "- Exit code: ${{ steps.generate.outputs.exit_code }}" >> $GITHUB_STEP_SUMMARY