name: "📚 Generate Database Documentation"

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to document'
        required: false
        type: choice
        options:
          - production
          - staging
          - development
        default: production
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        type: boolean
        default: false

jobs:
  generate-db-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install minimal runtime deps (CI-only)
        working-directory: scripts
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund --no-progress
          else
            npm init -y >/dev/null 2>&1
            npm install pg dotenv pg-format --no-save --no-audit --no-fund --no-progress
            rm -f package.json package-lock.json
          fi

      - name: Run generator
        id: generate
        working-directory: scripts
        env:
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_FORCE_UPDATE: ${{ github.event.inputs.force_update }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ENVIRONMENT="${INPUT_ENVIRONMENT:-production}"
          FORCE_UPDATE="${INPUT_FORCE_UPDATE:-false}"
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          LOG_FILE="generation-${TIMESTAMP}.log"
          REPORT_FILE="generation-report-${TIMESTAMP}.json"

          echo "ENVIRONMENT=${ENVIRONMENT}"
          echo "FORCE_UPDATE=${FORCE_UPDATE}"
          echo "RUN_ID=${RUN_ID}"

          START=$(date +%s)
          if timeout 600 node generate-complete-docs.js 2>&1 | tee "${LOG_FILE}"; then
            EXIT_CODE=0
          else
            EXIT_CODE=${PIPESTATUS[0]:-1}
          fi
          END=$(date +%s)
          DURATION=$((END - START))

          cat > "${REPORT_FILE}" <<EOF
{
  "run_id": "${RUN_ID}",
  "environment": "${ENVIRONMENT}",
  "timestamp": "$(date -u -Iseconds)",
  "duration_seconds": ${DURATION},
  "exit_code": ${EXIT_CODE},
  "force_update": "${FORCE_UPDATE}"
}
EOF

          echo "log_file=${LOG_FILE}" >> "$GITHUB_OUTPUT"
          echo "report_file=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
          echo "duration=${DURATION}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ "${EXIT_CODE}" -ne 0 ]; then
            echo "::error::Generator failed with exit code ${EXIT_CODE}"
            exit "${EXIT_CODE}"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-docs-${{ github.run_id }}
          path: |
            scripts/${{ steps.generate.outputs.log_file }}
            scripts/${{ steps.generate.outputs.report_file }}
          retention-days: 7
          if-no-files-found: warn