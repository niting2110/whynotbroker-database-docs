name: 🐛 Debug Database Connection
on: workflow_dispatch

jobs:
  debug-secret:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Debug Secrets
        run: |
          echo "=== Debugging Secrets ==="
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          
          # Test if secret exists (without revealing value)
          if [ -n "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "✅ PRODUCTION_DATABASE_URL exists"
            echo "Length: ${#{{ secrets.PRODUCTION_DATABASE_URL }}} characters"
            
            # Show first few characters (redacted)
            SECRET="${{ secrets.PRODUCTION_DATABASE_URL }}"
            echo "Starts with: ${SECRET:0:15}..."
          else
            echo "❌ PRODUCTION_DATABASE_URL is EMPTY or doesn't exist"
          fi
          
          # Test if DB_SSL exists
          if [ -n "${{ secrets.DB_SSL }}" ]; then
            echo "✅ DB_SSL exists: ${{ secrets.DB_SSL }}"
          else
            echo "⚠️ DB_SSL not set (using default)"
          fi
          
          # List all secrets that start with DATABASE or DB
          echo ""
          echo "=== All DB-related secrets (names only) ==="
          echo "Note: GitHub doesn't allow listing secrets, but we can check what we have access to"